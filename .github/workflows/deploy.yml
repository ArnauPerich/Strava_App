name: Deploy to VPS

on:
  push:
    branches:
      - PRO

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /tmp/strava-app
            git pull origin PRO
            cp /tmp/strava-app/backend/app.py /opt/strava-app/backend/app.py
            cp /tmp/strava-app/backend/requirements.txt /opt/strava-app/backend/requirements.txt
            /opt/strava-app/venv/bin/pip install -r /opt/strava-app/backend/requirements.txt -q
            systemctl restart strava-app
